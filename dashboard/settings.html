<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Nagger — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col" hx-headers='{"X-Requested-With": "htmx"}'>
  
  <!-- App Bar -->
  <header class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700/50 sticky top-0 z-50 pt-safe">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center">
      <a href="/app.html" class="mr-4 w-10 h-10 rounded-full hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </a>
      <span class="font-bold text-lg tracking-tight text-white">Settings</span>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto max-w-3xl w-full mx-auto p-4 sm:p-6 pb-24">
    <div hx-get="/api/partials/settings"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-credentials="include">
      <!-- Skeleton Loader -->
      <div class="animate-pulse bg-slate-800 rounded-2xl h-[400px]"></div>
    </div>
    
    <div class="mt-8 text-center space-y-4">
        <button onclick="logout()" class="text-sm font-medium text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-6 py-3 rounded-xl transition-colors">
            Log Out Securely
        </button>
        <p class="text-xs text-slate-500">Nagger Dashboard v3.0<br>Secure session authentication active.</p>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        ? 'http://127.0.0.1:8787'
        : 'https://nagger-bot.nagger.workers.dev';
        
    document.body.addEventListener('htmx:configRequest', function(evt) {
        if (evt.detail.path.startsWith('/api/')) {
            evt.detail.path = API_BASE + evt.detail.path;
        }
    });

    document.body.addEventListener('htmx:responseError', function(evt) {
        if (evt.detail.xhr.status === 401) {
            window.location.href = '/index.html';
        }
    });
    
    function logout() {
        // Clear session cookie locally then redirect to login
        document.cookie = "nagger_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        window.location.href = '/index.html';
    }
  </script>
</body>
</html>
